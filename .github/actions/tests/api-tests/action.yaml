name: 'Run API Tests'
description: 'Sets up Python environment and executes API tests with pytest using specified markers'
author: 'konrad'
inputs:
  user_api_secret:
    description: 'API secret of created user'
    required: true
  api_markers:
    description: 'Markers to filter tests'
    required: false
    default: ${{ matrix.envfiles.apimarkers }}
  suite:
    description: 'API matrix suite: api or mcp'
    default: api
  mcp_storage:
    description: 'MCP Dashboard storage'
    default: mongo
  mcp_serializer:
    description: 'MCP Redis serializer'
    default: msgpack
  shard_count:
    description: 'MCP isolated stack shard count'
    default: '1'
  shard_index:
    description: 'MCP zero-based stack shard index'
    default: '0'
runs:
  using: "composite"
  steps:
    - name: Set up Python      
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        cache: 'pip'
        python-version: ${{ inputs.suite == 'mcp' && '3.12' || '3.10' }}
    - name: Execute API tests
      if: inputs.suite != 'mcp'
      id: test_execution
      shell: bash
      working-directory: tyk-analytics/tests/api
      env:
        USER_API_SECRET: ${{ inputs.user_api_secret }}
        API_MARKERS: ${{ inputs.api_markers }}
      run: |
          pip install --no-deps -r requirements.txt
          cat >pytest.env <<-EOF
          TYK_TEST_BASE_URL=http://localhost:3000/
          TYK_TEST_GW_URL=https://localhost:8080/
          TYK_TEST_GW_1_ALFA_URL=https://localhost:8181/
          TYK_TEST_GW_1_BETA_URL=https://localhost:8182/
          TYK_TEST_GW_2_ALFA_URL=https://localhost:8281/
          TYK_TEST_GW_2_BETA_URL=https://localhost:8282/
          TYK_TEST_MONGODB=localhost:27017
          TYK_TEST_REDIS=localhost
          TYK_TEST_DB_ADMIN=12345
          TYK_TEST_GW_SECRET=352d20ee67be67f6340b4c0605b044b7
          TYK_TEST_DB_NAME=tyk_analytics
          TYK_TEST_FEDERATION_HOST=federation
          TYK_TEST_GRAPHQL_FAKER_HOST=graphql-faker
          GATEWAY_CONTAINER_NAME=tyk
          TYK_TEST_KEYCLOAK_URL=http://localhost:8180
          TYK_TEST_KEYCLOAK_INTERNAL_URL=http://keycloak:8080
          EOF
          env $(cat pytest.env | xargs) pytest -c pytest_ci.ini --ci --junitxml=${XUNIT_REPORT_PATH} -m "${{ inputs.api_markers }}"
    - name: Execute MCP API shard and qualify its results
      if: inputs.suite == 'mcp'
      shell: bash
      working-directory: tyk-analytics/tests/api
      env:
        API_MARKERS: ${{ inputs.api_markers }}
        MCP_STORAGE: ${{ inputs.mcp_storage }}
        MCP_SERIALIZER: ${{ inputs.mcp_serializer }}
        SHARD_COUNT: ${{ inputs.shard_count }}
        SHARD_INDEX: ${{ inputs.shard_index }}
        PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      run: |
        python scripts/mcp_api_stack.py execute \
          --manifest "$GITHUB_WORKSPACE/auto/.mcp-source-manifest.json" \
          --artifacts "$GITHUB_WORKSPACE/mcp-evidence" --storage "$MCP_STORAGE" --serializer "$MCP_SERIALIZER" \
          --shard-count "$SHARD_COUNT" --shard-index "$SHARD_INDEX" --markers "$API_MARKERS" --report "$XUNIT_REPORT_PATH"
