name: 'Set Up Test Environment'
description: 'Configures and starts the test environment with Docker Compose, setting up master and slave datacenters'
author: 'konrad'
inputs:
  base_ref:
    description: 'Base ref for the test'
    required: true
  tags:
    description: 'Tags for the test'
    required: true
  github_token:
    description: 'GitHub token for API access'
    required: true
  TYK_DB_LICENSEKEY:
    description: 'Tyk DB license key'
    required: true
  TYK_MDCB_LICENSE:
    description: 'Tyk MDCB license key'
    required: true
  dashboard_image:
    description: 'Override dashboard image (optional). If not provided, uses gromit policy matching.'
    required: false
    default: ''
  suite:
    description: 'API matrix suite: api or mcp'
    default: api
  mcp_manifest:
    description: 'Resolved component image digests and environment revision'
    default: ''
  mcp_storage:
    description: 'MCP Dashboard storage'
    default: mongo
  mcp_serializer:
    description: 'MCP Redis serializer'
    default: msgpack
  mcp_cache:
    description: 'MCP cache overlay'
    default: redis7
outputs:
  USER_API_SECRET:
    description: 'User API secret for the test'
    value: ${{ steps.env_up.outputs.USER_API_SECRET }}

runs:
  using: "composite"
  steps:
    - name: Starting environment
      if: inputs.suite != 'mcp'
      working-directory: auto
      shell: bash
      id: env_up
      env:
        ECR: "754489498669.dkr.ecr.eu-central-1.amazonaws.com"
        REPO_NAME: ${{ github.event.repository.name }}
        TAGS: ${{ inputs.tags }}
        BASE_REF: ${{ inputs.base_ref }}
        pull_policy: 'if_not_present'
        GITHUB_TOKEN: ${{ inputs.github_token }}
        TYK_DB_LICENSEKEY: ${{ inputs.TYK_DB_LICENSEKEY }}
        TYK_MDCB_LICENSE: ${{ inputs.TYK_MDCB_LICENSE }}
        DASHBOARD_IMAGE: ${{ inputs.dashboard_image }}
      run: |
        match_tag=$ECR/$REPO_NAME:$BASE_REF
        # Extract the non-SHA tag from TAGS
        # Debug: Show the raw TAGS input
        echo "Raw TAGS input:"
        echo "$TAGS"
        
        # Convert TAGS to an array by splitting on newlines
        readarray -t tag_array <<< "$TAGS"
        
        echo "Found ${#tag_array[@]} tags:"
        for i in "${!tag_array[@]}"; do
          # Trim leading/trailing whitespace
          tag_array[$i]=$(echo "${tag_array[$i]}" | xargs)
          echo "  $i: ${tag_array[$i]}"
        done
        
        # Find the tag that doesn't contain "sha-"
        for tag in "${tag_array[@]}"; do
          if [[ ! $tag == *":sha-"* ]]; then
            non_sha_tag=$tag
            echo "Found non-SHA tag: $non_sha_tag"
            break
          fi
        done
        
        # If no non-SHA tag found, use the first tag as fallback
        if [ -z "$non_sha_tag" ]; then
          non_sha_tag=${tag_array[0]}
          echo "No non-SHA tag found, using first tag as fallback: $non_sha_tag"
        fi
        
        echo "Using tag: $non_sha_tag"
        
        set -eaxo pipefail
        docker run -q --rm -v ~/.docker/config.json:/root/.docker/config.json tykio/gromit policy match ${non_sha_tag} ${match_tag} 2>versions.env

        # Override dashboard image if provided
        if [ -n "$DASHBOARD_IMAGE" ]; then
          echo "🔧 Overriding dashboard image with: $DASHBOARD_IMAGE"
          echo "tyk_analytics_image=$DASHBOARD_IMAGE" >> versions.env
        fi

        echo '# alfa and beta have to come after the override
        tyk_image="$ECR/tyk-ee"
        tyk_alfa_image=$tyk_image
        tyk_beta_image=$tyk_image
        confs_dir=./pro-ha
        env_file=local.env' >> versions.env
        if [[ $REPO_NAME != "tyk-pump" ]]; then
          tyk_pump_image=${{ matrix.envfiles.pump || matrix.pump }}
        fi
        if [[ $REPO_NAME != "tyk-sink" ]]; then
          tyk_sink_image=${{ matrix.envfiles.sink || matrix.sink }}
        fi
        cat ./confs/${{ matrix.envfiles.config }}.env local-${{ matrix.envfiles.db }}.env > local.env
        echo "::group::versions"
        cat versions.env local.env
        echo "::endgroup::"
        # bring up env, the project name is important
        docker compose -p auto -f pro-ha.yml -f deps_pro-ha.yml -f ${{ matrix.envfiles.db }}.yml -f ${{ matrix.envfiles.cache }}.yml --env-file versions.env --profile master-datacenter up --quiet-pull -d
        ./dash-bootstrap.sh http://localhost:3000
        docker compose -p auto -f pro-ha.yml -f deps_pro-ha.yml -f ${{ matrix.envfiles.db }}.yml -f ${{ matrix.envfiles.cache }}.yml --env-file versions.env --profile slave-datacenter up --quiet-pull -d
        echo "$(cat pytest.env | grep USER_API_SECRET)" >> $GITHUB_OUTPUT
        echo "ts=$(date +%s%N)" >> $GITHUB_OUTPUT
        echo "::group::Docker images"
        docker ps -a --format '{{.Names}}\t{{.Image}}'
        echo "::endgroup::"
    - name: Set up MCP API environment Python
      if: inputs.suite == 'mcp'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: tyk-analytics/tests/api/requirements.txt
    - name: Prepare published-image MCP API environment
      if: inputs.suite == 'mcp'
      id: mcp_env_up
      working-directory: auto
      shell: bash
      env:
        MCP_MANIFEST: ${{ inputs.mcp_manifest }}
        PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
        MCP_STORAGE: ${{ inputs.mcp_storage }}
        MCP_SERIALIZER: ${{ inputs.mcp_serializer }}
        MCP_CACHE: ${{ inputs.mcp_cache }}
        TYK_DB_LICENSEKEY: ${{ inputs.TYK_DB_LICENSEKEY }}
        TYK_MDCB_LICENSE: ${{ inputs.TYK_MDCB_LICENSE }}
      run: |
        set -euo pipefail
        umask 077
        case "$MCP_CACHE" in redis7|valkey9) ;; *) echo 'Unsupported MCP cache overlay'; exit 1 ;; esac
        test -f mcp.yml || { echo 'Selected tyk-pro revision lacks the MCP API environment'; exit 1; }
        python -m pip install -r ../tyk-analytics/tests/api/requirements.txt
        python -m pytest --rootdir=../tyk-analytics/tests/api/scripts \
          -c ../tyk-analytics/tests/api/pytest_local.ini -o addopts= -o env= -n 0 \
          ../tyk-analytics/tests/api/scripts/test_run_mcp_v2.py \
          ../tyk-analytics/tests/api/scripts/test_run_mcp_v2_stack.py \
          ../tyk-analytics/tests/api/scripts/test_mcp_sharding.py \
          ../tyk-analytics/tests/api/scripts/test_aggregate_mcp_v2.py \
          ../tyk-analytics/tests/api/scripts/test_mcp_api_stack.py -q
        python - <<'PY'
        import json, os
        from pathlib import Path
        manifest = json.loads(os.environ['MCP_MANIFEST'])
        Path('.mcp-source-manifest.json').write_text(json.dumps(manifest))
        values = {'tyk_ee_image': manifest['images']['gateway'],
                  'tyk_analytics_image': manifest['images']['dashboard'],
                  'tyk_pump_image': manifest['images']['pump'],
                  'tyk_sink_image': manifest['images'].get('sink', 'unused'),
                  'tyk_mock_image': manifest['images']['mock'],
                  'MCP_RUNTIME_DIR': str(Path('../mcp-evidence/runtime').resolve()),
                  'MCP_API_ROOT': str(Path('../tyk-analytics/tests/api').resolve()),
                  'MCP_UID': str(os.getuid()), 'MCP_GID': str(os.getgid())}
        Path('versions.env').write_text('\n'.join(f'{key}={value}' for key,value in values.items())+'\n')
        with open(os.environ['GITHUB_ENV'], 'a') as output:
            output.write('MCP_TOPOLOGY='+manifest['topology']+'\n')
        PY
        artifacts="$GITHUB_WORKSPACE/mcp-evidence"
        mkdir -p "$artifacts"
        runner="$GITHUB_WORKSPACE/tyk-analytics/tests/api/scripts/mcp_api_stack.py"
        common=(--manifest "$PWD/.mcp-source-manifest.json" --artifacts "$artifacts" --storage "$MCP_STORAGE" --serializer "$MCP_SERIALIZER")
        phase() {
          local name=$1
          shift
          python "$runner" "$name" "${common[@]}" "$@" >> "$artifacts/setup-runtime.log" 2>&1 || {
            echo "MCP API environment phase failed: $name (protected diagnostics retained)"
            return 1
          }
        }
        phase prepare
        MCP_TOPOLOGY=$(python -c 'import json; print(json.load(open(".mcp-source-manifest.json"))["topology"])')
        compose=(docker compose -p auto -f mcp.yml -f mongo7.yml -f postgres15.yml -f "$MCP_CACHE.yml" --env-file versions.env)
        cache=redis
        if [ "$MCP_CACHE" = valkey9 ]; then cache=valkey; fi
        backing=(mongo postgres "$cache" mcp-server keycloak httpbin collector)
        if [ "$MCP_TOPOLOGY" = mdcb ]; then backing+=("$cache-datacenter-1"); fi
        "${compose[@]}" up -d --wait --wait-timeout 120 "${backing[@]}"
        "${compose[@]}" up -d tyk-analytics
        phase dashboard
        "${compose[@]}" up -d tyk tyk-pump
        phase bootstrap
        gateway=tyk
        if [ "$MCP_TOPOLOGY" = mdcb ]; then
          "${compose[@]}" up -d tyk-sink tyk-data-plane-pump tyk-gateway-datacenter-1-alfa
          gateway=tyk-gateway-datacenter-1-alfa
        fi
        container=$("${compose[@]}" ps -q "$gateway")
        nohup docker logs --follow "$container" > "$artifacts/gateway-runtime.log" 2>&1 < /dev/null &
        phase verify --compose-file mcp.yml --compose-file mongo7.yml --compose-file postgres15.yml --compose-file "$MCP_CACHE.yml"
