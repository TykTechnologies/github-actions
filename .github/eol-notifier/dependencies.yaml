# Dependencies tracked by .github/workflows/eol-notifier.yaml.
#
# Each entry maps a dependency to an endoflife.date product slug. Several
# entries may share a slug: services the API does not track ride on the
# lifecycle of their upstream OSS engine and are marked upstream_proxy.
---
thresholds_months: [12, 6, 1]

dependencies:
  # Upstream OSS engines, tracked directly.
  - name: Redis
    product: redis
    track: [eol]
  - name: Valkey
    product: valkey
    track: [eol, eoas]
  - name: PostgreSQL
    product: postgresql
    track: [eol]
  - name: MongoDB
    product: mongodb
    track: [eol]
  - name: MySQL
    product: mysql
    track: [eol, eoas]
  - name: MariaDB
    product: mariadb
    track: [eol, eoes]

  # RPM: RHEL 7, 8, and 9. eoas (Full Support) ends years before eol
  # (Maintenance Support), and eoes (Extended Life Cycle Support) years after;
  # tracking eol alone would miss the Full Support cliff and call a version
  # dead long before ELS actually ends it.
  - name: RPM (RHEL 7, 8, 9)
    product: rhel
    track: [eoas, eol, eoes]
    cycles: ["7", "8", "9"]
  # DEB: Ubuntu 22.04 LTS, 24.04 LTS, 26.04 LTS, and Debian 12 (Bookworm),
  # 13 (Trixie). Debian's eoes (Debian LTS) runs well past its eol (Debian
  # Security Support), so eol alone would call a release dead years early.
  - name: DEB (Ubuntu 22.04 LTS, 24.04 LTS, 26.04 LTS)
    product: ubuntu
    track: [eol, eoes]
    cycles: ["22.04", "24.04", "26.04"]
  - name: DEB (Debian 12 Bookworm, 13 Trixie)
    product: debian
    track: [eol, eoes]
    cycles: ["12", "13"]

  # EE-FIPS validated set: RHEL 7, 8, and 9, and Ubuntu 24.04 only.
  - name: EE-FIPS (RHEL 7, 8, 9)
    product: rhel
    track: [eoas, eol, eoes]
    cycles: ["7", "8", "9"]
  - name: EE-FIPS (Ubuntu 24.04)
    product: ubuntu
    track: [eol, eoes]
    cycles: ["24.04"]

  # HashiCorp tooling. A version gets its end-of-life date on the day a newer
  # release drops it out of support, so the date is never in the future: expect
  # the ended alert from these, not the 12/6/1 month countdown.
  - name: HashiCorp Vault
    product: hashicorp-vault
    track: [eol]
  - name: HashiCorp Consul
    product: consul
    track: [eol]

  # Managed services with their own published lifecycle.
  - name: Amazon ElastiCache (Redis)
    product: amazon-elasticache-redis
    track: [eol, eoes]
  - name: Amazon RDS PostgreSQL
    product: amazon-rds-postgresql
    track: [eol, eoes]
  - name: Amazon DocumentDB
    product: amazon-documentdb
    track: [eol, eoes]
  - name: Azure Database for PostgreSQL
    product: azure-database-for-postgresql
    track: [eol]

  # Not tracked by endoflife.date. The upstream engine stands in for them, so
  # the reported dates are indicative and need confirming with the provider.
  - name: GCP MemoryStore
    product: redis
    track: [eol]
    upstream_proxy: true
  - name: GCP Cloud SQL
    product: postgresql
    track: [eol]
    upstream_proxy: true
  - name: Azure DocumentDB
    product: mongodb
    track: [eol]
    upstream_proxy: true
