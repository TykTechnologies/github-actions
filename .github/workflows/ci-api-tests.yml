name: API test orchestration regressions
on:  # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - .github/actions/tests/**
      - .github/workflows/ci-api-tests.yml
      - tests/test_api_*.py
  push:
    branches: [main]
    paths:
      - .github/actions/tests/**
      - .github/workflows/ci-api-tests.yml
      - tests/test_api_*.py
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python -m unittest discover -s tests -p 'test_api_*.py' -v
