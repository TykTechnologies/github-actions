# yamllint disable rule:line-length
---
name: CI tooling

# This workflow builds the CI tooling from docker/tools/
# within this repository. It runs whenever a file inside
# is modified, and on a weekly schedule to get updates.

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  repository_dispatch:
    types: ['exp-cmd']
  pull_request:
    paths:
      - 'docker/tools/**'
      - '.github/workflows/ci-docker-tools.yml'
  push:
    paths:
      - 'docker/tools/**'
      - '.github/workflows/ci-docker-tools.yml'
    branches:
      - 'main'
  schedule:
    - cron: '0 0 * * 1'  # Run every Monday at 12:00 AM UTC

# Make sure to cancel previous job runs in case a PR
# gets new commits. Changes being merged to the main
# branch will continue to run.

concurrency:
  group: ${{ github.head_ref || github.run_id }}-docker-tools
  cancel-in-progress: true

jobs:
  tools-latest:
    name: 'Build tykio/ci-tools:${{ matrix.tag }}'
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        tag:
          - 'latest'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Built into the local daemon, scanned, then pushed: what reaches Docker Hub is exactly the image
      # that was scanned. Rebuilding with push: true instead could pull a newer base image (pull: true).
      - name: 'Build tykio/ci-tools:${{ matrix.tag }}'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          pull: true
          load: true
          no-cache: true
          context: docker/tools/${{ matrix.tag }}
          tags: tykio/ci-tools:${{ matrix.tag }}

      # Report only for now: findings show in the job summary without failing the build.
      - name: 'Scan tykio/ci-tools:${{ matrix.tag }} for secrets'
        uses: ./.github/actions/secret-scan
        with:
          image: docker://tykio/ci-tools:${{ matrix.tag }}
          enforce: "false"

      - name: 'Push tykio/ci-tools:${{ matrix.tag }}'
        if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ matrix.tag }}
        run: docker push "tykio/ci-tools:$TAG"

      - run: docker image ls

      - name: 'Extract tykio/ci-tools:${{ matrix.tag }}'
        uses: shrink/actions-docker-extract@f1ef61065b78731fe3310b4e84e511f6a927a77e  # v4
        with:
          image: tykio/ci-tools:${{ matrix.tag }}
          path: /usr/local/bin/.
          destination: /usr/local/bin

      - run: gotestsum --version
