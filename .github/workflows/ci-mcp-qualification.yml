name: MCP qualification workflow regressions

on:  # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - .github/workflows/mcp-qualification.yml
      - .github/workflows/ci-mcp-qualification.yml
      - tests/test_mcp_qualification.py
  push:
    branches: [main]
    paths:
      - .github/workflows/mcp-qualification.yml
      - .github/workflows/ci-mcp-qualification.yml
      - tests/test_mcp_qualification.py

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install workflow parser
        run: python -m pip install PyYAML==6.0.2
      - name: Check revision resolution and shard orchestration
        run: python -m unittest discover -s tests -p test_mcp_qualification.py -v
