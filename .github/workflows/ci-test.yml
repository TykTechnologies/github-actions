name: CI Tests

on:
  push:
    branches:
      - main
      - 'release-*'
    paths:
      - 'branch-suggestion/**'
      - 'jira-linter/**'
      - 'eol-notifier/**'
      - '.github/workflows/ci-test.yml'
  pull_request:
    paths:
      - 'branch-suggestion/**'
      - 'jira-linter/**'
      - 'eol-notifier/**'
      - '.github/workflows/ci-test.yml'

jobs:
  test-branch-suggestion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: branch-suggestion/package-lock.json

      - name: Install dependencies
        working-directory: branch-suggestion
        run: npm ci --ignore-scripts

      - name: Run tests
        working-directory: branch-suggestion
        run: npm test

      - name: Generate coverage report
        working-directory: branch-suggestion
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        if: always()
        with:
          files: ./branch-suggestion/coverage/coverage-final.json
          flags: branch-suggestion

  test-jira-linter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version: '1.26'

      - name: Run tests
        working-directory: jira-linter
        run: go test ./...

  test-eol-notifier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version: '1.26.5'

      - name: Run tests
        working-directory: eol-notifier
        run: go test ./...
