name: Dependency Change Guard

on:
  workflow_call:
    inputs:
      label_name:
        description: 'Label name that bypasses the guard'
        default: 'deps-reviewed'
        type: string
      extra_paths:
        description: 'Additional paths to monitor (space-separated)'
        default: ''
        type: string

jobs:
  dependency-guard:
    runs-on: ubuntu-latest
    # No permissions block here: a called workflow can only lower the caller's
    # permissions, and asking for more than the caller grants fails the run.
    # Callers set them where they call this workflow:
    #   permissions:
    #     contents: read
    #     pull-requests: read   # optional: lets a re-run see a label added later
    steps:
      - name: Checkout
        if: ${{ github.event.pull_request }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Check for dependency changes
        if: ${{ github.event.pull_request }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          EXTRA_PATHS: ${{ inputs.extra_paths }}
          LABEL: ${{ inputs.label_name }}
          EVENT_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Read the PR's labels now, not from the event: a re-run after
          # someone adds the label then sees it, so callers don't need the
          # `labeled` trigger. Without pull-requests: read the API call fails
          # and the labels from the event are used, as before.
          if LABELS=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.labels[].name' 2>/dev/null); then
            echo "Labels read from the PR now."
          else
            LABELS=$(jq -r '.[]' <<<"$EVENT_LABELS")
            echo "::notice title=Dependency Guard::Could not read the PR's current labels (grant pull-requests: read to the caller); using the labels from the event."
          fi
          if grep -qxF -- "$LABEL" <<<"$LABELS"; then
            echo "'$LABEL' is on the PR: dependency check skipped."
            exit 0
          fi

          git fetch origin "$BASE_REF" --depth=1

          # Default monitored paths
          PATHS=(
            go.mod go.sum vendor/
            package.json package-lock.json yarn.lock pnpm-lock.yaml node_modules/
            '**/requirements*.txt' '**/Pipfile' '**/Pipfile.lock'
            '**/pyproject.toml' '**/poetry.lock' '**/setup.py' '**/setup.cfg'
          )

          # Add extra paths if provided (split on spaces, no glob expansion)
          if [ -n "$EXTRA_PATHS" ]; then
            read -ra EXTRA <<<"$EXTRA_PATHS"
            PATHS+=("${EXTRA[@]}")
          fi

          if git merge-base "origin/$BASE_REF" HEAD >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only "origin/$BASE_REF"...HEAD -- "${PATHS[@]}")
          else
            echo "::warning title=Dependency Guard::No merge base found between HEAD and origin/$BASE_REF. Falling back to direct tree comparison (two-dot diff)."
            CHANGED=$(git diff --name-only "origin/$BASE_REF"..HEAD -- "${PATHS[@]}")
          fi

          if [ -n "$CHANGED" ]; then
            echo "::error::Dependency files changed in this PR. A reviewer must verify the changes and add the '$LABEL' label to unblock CI."
            echo ""
            echo "Changed dependency files:"
            # File names come from the PR: a line starting with :: must not be read as a
            # workflow command, so command processing is off while they are printed.
            STOP="$(openssl rand -hex 16)"
            echo "::stop-commands::$STOP"
            echo "$CHANGED"
            echo "::$STOP::"
            echo ""
            echo "To unblock: add the '$LABEL' label after reviewing the dependency changes, then re-run the failed jobs."
            exit 1
          fi

          echo "No dependency file changes detected."
