name: Go Vulnerability detection

on:
  workflow_call:

jobs:
  govulncheck:
    name: Go Vulnerability detection
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          cache: false

      - name: Govulncheck scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4  # d1f380186385b4f64e00313f31743df8e4b89a77
          govulncheck ./...
