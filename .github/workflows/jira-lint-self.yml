---
name: jira-lint self-check

# Runs the jira-linter action from this branch against this repository's own
# pull requests, mirroring how consuming repositories call it. Without this,
# nothing in CI exercises jira-linter/action.yaml.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  validate:
    name: lint with container
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # Assume the ECR role that pulls the linter image
      pull-requests: write  # Post and delete the sticky comment
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Validate Jira ticket
        uses: ./jira-linter
        with:
          jira-base-url: ${{ secrets.JIRA_BASE_URL }}
          jira-read-auth: ${{ secrets.JIRA_READ_AUTH }}
