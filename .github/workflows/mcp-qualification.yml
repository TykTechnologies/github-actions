# Dashboard owns the stack runner and fixtures; component repositories call this workflow.
name: Sharded MCP stack qualification

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      topology:
        description: Direct Gateway/Pump or MDCB data-plane qualification
        type: string
        default: direct
        required: false
    secrets:
      PROBE_APP_ID:
        required: true
      PROBE_APP_PRIVATE_KEY:
        required: true
      DASH_LICENSE:
        required: true
      MDCB_LICENSE:
        required: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve MCP component revisions
    runs-on: ${{ vars.WARP_RUNNER_8X_X64 || vars.DEFAULT_RUNNER }}
    timeout-minutes: 5
    outputs:
      gateway: ${{ steps.revisions.outputs.gateway }}
      dashboard: ${{ steps.revisions.outputs.dashboard }}
      pump: ${{ steps.revisions.outputs.pump }}
      sink: ${{ steps.revisions.outputs.sink }}
      mock: 29fefa17ad1a8ce168a66ccc7680030d46cfbb13
    steps:
      - name: Validate topology prerequisites
        env:
          TOPOLOGY: ${{ inputs.topology }}
          MDCB_LICENSE: ${{ secrets.MDCB_LICENSE }}
        run: |
          case "$TOPOLOGY" in
            direct) ;;
            mdcb) test -n "$MDCB_LICENSE" || { echo 'MDCB_LICENSE is required for MDCB qualification'; exit 1; } ;;
            *) echo 'Unsupported qualification topology'; exit 1 ;;
          esac
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2.2.2
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies
          permission-contents: read
          repositories: |
            tyk
            tyk-analytics
            tyk-pump
            tyk-sink
            tyk-mock-mcp-server
            tyk-sync-internal
            api-definition
      - name: Resolve coordinated source revisions
        id: revisions
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
          TOPOLOGY: ${{ inputs.topology }}
        shell: bash
        run: |
          set -euo pipefail
          components=(gateway dashboard pump)
          if [ "$TOPOLOGY" = mdcb ]; then components+=(sink); fi
          for component in "${components[@]}"; do
            case "$component" in
              gateway) repository=TykTechnologies/tyk ;;
              dashboard) repository=TykTechnologies/tyk-analytics ;;
              pump) repository=TykTechnologies/tyk-pump ;;
              sink) repository=TykTechnologies/tyk-sink ;;
            esac
            if [ "$repository" = "$CALLER_REPOSITORY" ]; then
              revision=$CALLER_SHA
            elif revision=$(gh api "repos/$repository/git/ref/heads/$SOURCE_BRANCH" --jq '.object.sha'); then
              :
            else
              revision=$(gh api "repos/$repository/git/ref/heads/$BASE_BRANCH" --jq '.object.sha')
            fi
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
            echo "$component=$revision" >> "$GITHUB_OUTPUT"
            echo "$component source revision: $revision"
          done
  qualify:
    needs: resolve
    name: MCP ${{ inputs.topology }} / ${{ matrix.serializer }} / ${{ matrix.storage }} / shard ${{ matrix.shard }}
    runs-on: ${{ vars.WARP_RUNNER_8X_X64 || vars.DEFAULT_RUNNER }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        serializer: [msgpack, protobuf]
        storage: [mongo, postgres]
        shard: [0, 1, 2, 3]
    env:
      MCP_COMPOSE_PROJECT: mcp-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.topology }}-${{ matrix.serializer }}-${{ matrix.storage }}-${{ matrix.shard }}
      GOWORK: 'off'
      GOPRIVATE: github.com/TykTechnologies
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      TYK_TEST_DB_NAME: tt18006_v2
      TYK_TEST_MONGODB: 127.0.0.1:27017
      TYK_TEST_REDIS: 127.0.0.1
      TYK_TEST_REDIS_PORT: '6379'
      TYK_TEST_KEYCLOAK_URL: http://127.0.0.1:8180
      TYK_TEST_KEYCLOAK_INTERNAL_URL: http://127.0.0.1:8180
      TYK_TEST_UPSTREAM_URL: http://127.0.0.1:9879/
      MCP_REDIS_IMAGE: ${{ matrix.storage == 'postgres' && 'valkey/valkey:9' || 'redis:7' }}
    steps:
      - name: Report available build disk capacity
        run: df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2.2.2
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies
          permission-contents: read
          repositories: |
            tyk
            tyk-analytics
            tyk-pump
            tyk-sink
            tyk-mock-mcp-server
            tyk-sync-internal
            api-definition
      - name: Checkout Dashboard and owned test runner
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          repository: TykTechnologies/tyk-analytics
          ref: ${{ needs.resolve.outputs.dashboard }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          path: mcp/dashboard
      - name: Checkout Gateway
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          repository: TykTechnologies/tyk
          ref: ${{ needs.resolve.outputs.gateway }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          path: mcp/gateway
      - name: Checkout Pump
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          repository: TykTechnologies/tyk-pump
          ref: ${{ needs.resolve.outputs.pump }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          path: mcp/pump
      - name: Checkout MDCB
        if: inputs.topology == 'mdcb'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          repository: TykTechnologies/tyk-sink
          ref: ${{ needs.resolve.outputs.sink }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          path: mcp/sink
      - name: Checkout immutable mock fixtures
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          repository: TykTechnologies/tyk-mock-mcp-server
          ref: ${{ needs.resolve.outputs.mock }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          path: mcp/mock
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version-file: mcp/dashboard/go.mod
          cache-dependency-path: |
            mcp/dashboard/go.sum
            mcp/gateway/go.sum
            mcp/pump/go.sum
            mcp/sink/go.sum
            mcp/mock/go.sum
      - name: Configure private module fetch
        env:
          ORG_GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          for repository in tyk-analytics tyk-sync-internal api-definition; do
            git config --global url."https://x-access-token:${ORG_GH_TOKEN}@github.com/TykTechnologies/$repository".insteadOf "https://github.com/TykTechnologies/$repository"
          done
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mcp/dashboard/tests/api/requirements.txt
      - name: Install owned test dependencies
        run: python -m pip install -r mcp/dashboard/tests/api/requirements.txt
      - name: Check owned runner regressions
        run: |
          python -m pytest --rootdir=mcp/dashboard/tests/api/scripts \
            -c mcp/dashboard/tests/api/pytest_local.ini -o addopts= -o env= -n 0 \
            mcp/dashboard/tests/api/scripts/test_run_mcp_v2.py \
            mcp/dashboard/tests/api/scripts/test_run_mcp_v2_stack.py \
            mcp/dashboard/tests/api/scripts/test_mcp_sharding.py \
            mcp/dashboard/tests/api/scripts/test_aggregate_mcp_v2.py -q
      - name: Start dedicated backing services
        run: docker compose -p "$MCP_COMPOSE_PROJECT" -f mcp/dashboard/tests/api/fixtures/mcp_v2/compose.yml up -d --wait --wait-timeout 120
      - name: Select PostgreSQL profile
        if: matrix.storage == 'postgres'
        run: |
          echo 'TYK_TEST_DASHBOARD_POSTGRES_DSN=host=127.0.0.1 port=5432 user=tt18006 password=local-qa-only dbname=tt18006_v2 sslmode=disable' >> "$GITHUB_ENV"
          echo 'TYK_TEST_MCP_POSTGRES_DSN=host=127.0.0.1 port=5432 user=tt18006 password=local-qa-only dbname=tt18006_v2 sslmode=disable' >> "$GITHUB_ENV"
      - name: Build current sources and run MCP shard serially
        env:
          TYK_DB_LICENSEKEY: ${{ secrets.DASH_LICENSE }}
          MDCB_LICENSE: ${{ secrets.MDCB_LICENSE }}
          TOPOLOGY: ${{ inputs.topology }}
        run: |
          topology_args=(--topology "$TOPOLOGY")
          if [ "$TOPOLOGY" = mdcb ]; then topology_args+=(--sink-root mcp/sink); fi
          python mcp/dashboard/tests/api/scripts/run_mcp_v2_stack.py "${topology_args[@]}" \
            --gateway-root mcp/gateway --pump-root mcp/pump --mock-root mcp/mock \
            --artifacts mcp-evidence --serializer '${{ matrix.serializer }}' \
            --dashboard-storage '${{ matrix.storage }}' --allow-declared-skips \
            --shard-count 4 --shard-index '${{ matrix.shard }}' \
            --hash-key-function '${{ matrix.storage == 'postgres' && 'murmur128' || 'sha256' }}' \
            --pytest-marker 'mcp and not local and not dind and not mdcb and not upgrade and not resilience' \
            tests/
      - name: Retain sanitized qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: mcp-qualification-${{ inputs.topology }}-${{ matrix.serializer }}-${{ matrix.storage }}-shard-${{ matrix.shard }}
          path: |
            mcp-evidence/qualification.json
            mcp-evidence/tested-shas.json
            mcp-evidence/test-inventory.json
            mcp-evidence/mcp-summary.xml
            mcp-evidence/*-binary-version.txt
            mcp-evidence/*-candidate.diff
          if-no-files-found: warn
      - name: Stop task-owned backing services
        if: always()
        run: |
          docker compose -p "$MCP_COMPOSE_PROJECT" -f mcp/dashboard/tests/api/fixtures/mcp_v2/compose.yml down --volumes
          for repository in tyk-analytics tyk-sync-internal api-definition; do
            git config --global --remove-section "url.https://x-access-token:${ORG_GH_TOKEN}@github.com/TykTechnologies/$repository" 2>/dev/null || true
          done
        env:
          ORG_GH_TOKEN: ${{ steps.app-token.outputs.token }}

  aggregate:
    name: Verify complete MCP qualification
    needs: [resolve, qualify]
    if: always() && needs.resolve.result == 'success'
    runs-on: ${{ vars.WARP_RUNNER_8X_X64 || vars.DEFAULT_RUNNER }}
    timeout-minutes: 10
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2.2.2
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies
          permission-contents: read
          repositories: tyk-analytics
      - name: Checkout Dashboard-owned evidence validator
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          repository: TykTechnologies/tyk-analytics
          ref: ${{ needs.resolve.outputs.dashboard }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          path: mcp/dashboard
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install pytest==9.0.3
      - name: Download every shard's sanitized evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: mcp-qualification-${{ inputs.topology }}-*-shard-*
          path: mcp-shards
      - name: Require complete non-overlapping qualification
        env:
          TOPOLOGY: ${{ inputs.topology }}
          EXPECTED_SHAS: ${{ toJSON(needs.resolve.outputs) }}
        run: |
          python mcp/dashboard/tests/api/scripts/aggregate_mcp_v2.py \
            --artifacts mcp-shards --topology "$TOPOLOGY" --shard-count 4 \
            --expected-shas "$EXPECTED_SHAS" > mcp-aggregate.json
      - name: Retain aggregate qualification summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: mcp-qualification-${{ inputs.topology }}-aggregate
          path: mcp-aggregate.json
          if-no-files-found: error
