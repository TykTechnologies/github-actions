name: Nancy Scan

on:
  workflow_call:
    inputs:
      dir:
        required: false
        type: string
    secrets:
      PROBE_APP_ID:
        required: false
      PROBE_APP_PRIVATE_KEY:
        required: false

jobs:
  nancy_scan:
    name: Sonatype Nexus
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies

      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go 1.x in order to write go.list file
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          cache: false
          go-version: 1.17

      - name: Configure git access for Tyk's private Go modules
        env:
          GITHUB_PAT: ${{ steps.app-token.outputs.token }}
        run: |
          echo "https://x-access-token:$GITHUB_PAT@github.com" >> ~/.git-credentials
          git config --global credential.helper store
          git config --global url."https://x-access-token:${GITHUB_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Write Go List
        run: go list -json -m all > go.list
        working-directory: ./${{ inputs.dir }}

      - name: Nancy scan
        uses: sonatype-nexus-community/nancy-github-action@395e2fb168f674f96502e5652103d112899ea369  # main
        with:
          goListFile: ${{ inputs.dir }}/go.list
