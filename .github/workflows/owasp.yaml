name: OWASP scanner 

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string

jobs:
  zap_scan:
    name: OWASP Zap
    runs-on: ubuntu-latest
    steps:
      - name: OWASP Zap
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c  # v0.13.0
        with:
          target: ${{ inputs.target }}
          cmd_options: '-a'
          allow_issue_writing: false
