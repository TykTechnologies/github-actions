# yamllint disable rule:line-length
---
name: Publish jira-linter image

# This workflow builds the jira-linter image from jira-linter/ within
# this repository. It runs whenever a file inside is modified, and on a
# weekly schedule to pick up base image patches.
#
# Providing the image avoids compiling the linter with actions/setup-go
# and `go install` on every pull request run, in every repository that
# uses the jira-linter action.

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  pull_request:
    paths:
      - 'jira-linter/**'
      - '.github/workflows/publish-jira-linter.yml'
  push:
    paths:
      - 'jira-linter/**'
      - '.github/workflows/publish-jira-linter.yml'
    branches:
      - 'main'
  schedule:
    - cron: '0 3 * * 1'  # Run every Monday at 3:00 AM UTC

# Make sure to cancel previous job runs in case a PR
# gets new commits. Changes being merged to the main
# branch will continue to run.

concurrency:
  group: ${{ github.head_ref || github.run_id }}-publish-jira-linter
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jira-linter:
    name: 'Build tykio/jira-linter:latest'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      # Pull requests never push, so they need no credentials. Skipping the
      # login also keeps the registry token out of a job that builds and
      # runs code from the pull request.
      - uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc  # v2
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 'Build tykio/jira-linter:latest'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          push: ${{ github.ref_name == 'main' || github.event_name == 'workflow_dispatch' }}
          pull: true
          load: ${{ github.ref_name != 'main' && github.event_name != 'workflow_dispatch' }}
          no-cache: true
          context: jira-linter
          tags: tykio/jira-linter:latest
          # The Actions runner pulls this image itself and does not consume
          # attestations, so keep the manifest to a plain platform image.
          provenance: false

      - run: docker image ls

      # The linter exits non-zero here, because no Jira credentials are
      # configured. This checks that the container starts and that the
      # branch argument reaches the linter.
      - name: 'Smoke test tykio/jira-linter:latest'
        run: |
          docker run --rm tykio/jira-linter:latest feat/TT-16030-smoke 2>&1 | tee smoke.txt || true
          grep -q 'running the linter against feat/TT-16030-smoke branch' smoke.txt
