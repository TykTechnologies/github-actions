name: Smoke Tests

on:
  workflow_call:

jobs:			
  smoke-tests:
    runs-on: ${{ vars.DEFAULT_RUNNER }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: arn:aws:iam::754489498669:role/ecr_rw_tyk
          role-session-name: cipush
          aws-region: eu-central-1

      - id: ecr
        uses: aws-actions/amazon-ecr-login@183a1442edf41672e66566b7fc560e297a290896  # v2
        with:
          mask-password: 'true'

      - name: Run smoke tests
        shell: bash
        env:
          TYK_DB_LICENSEKEY: ${{ secrets.DASH_LICENSE }}
          GATEWAY_IMAGE: tykio/tyk-gateway:v5.0
          DASHBOARD_IMAGE: ${{ steps.ecr.outputs.registry }}/tyk-analytics:sha-${{ github.sha }}
        working-directory: ci
        run: |
          set -eaxo pipefail
          if [ ! -d smoke-tests ]; then
              echo "::warning No repo specific smoke tests defined"
              exit 0
          fi
          for d in smoke-tests/*/
          do
              echo Attempting to test $d
              if [ -d $d ] && [ -e $d/test.sh ]; then
                  cd $d
                  ./test.sh 
                  cd -
              fi
          done
  run-swagger-contract-tests:
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/release-tyk-analytics-swagger.yml
    secrets: inherit
  report_logs:
    runs-on: ${{ vars.DEFAULT_RUNNER }}
    needs: [smoke-tests]
    if: ${{ always() }}
    name: Report GH Logs on Failure
    permissions:
      actions: read
      contents: read
    steps:
      - name: Upload failed job logs
        uses: TykTechnologies/github-actions/.github/actions/gh-logs-analyser@d3fa20888fa2878e877e22bb7702141217290e7c  # main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gh_logs_analyser_token: ${{ secrets.GH_LOGS_ANALYSER }}
