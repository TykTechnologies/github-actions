# yamllint disable rule:line-length rule:truthy
---
name: release / tyk-analytics / tests

# Verbatim port of the post-build jobs from tyk-analytics' release.yml:
# test-controller-ui, ui-tests, test-controller-api, api-tests,
# test-controller-distros and upgrade-tests.
#
# aggregator-ci-test, release-tests and report_logs stay in the caller - each
# depends on a job that lives there (dep-guard / release-tests respectively).
#
# The only edits are:
#   - `needs: build` and the matching `if` drop out; the build is upstream of
#     this whole call, so the dependency is implicit
#   - image tags and BASE_REF/VARIATION arrive as inputs, since neither job
#     outputs nor caller workflow-level env cross a workflow_call boundary

on:
  workflow_call:
    inputs:
      std_tags:
        description: 'std CI image tags from the build'
        type: string
        required: true
      ee_tags:
        description: 'ee CI image tags from the build (empty for tyk-analytics)'
        type: string
        required: false
        default: ''
      base_ref:
        description: 'Base ref for test-controller (caller env does not propagate)'
        type: string
        required: true
      variation:
        description: 'Test variation'
        type: string
        required: false
        default: prod-variation

jobs:
  test-controller-ui:
    if: |
      !cancelled() &&
      github.event.pull_request.draft == false
    runs-on: ${{ vars.DEFAULT_RUNNER }}
    outputs:
      envfiles: ${{ steps.params.outputs.envfiles }}
      pump: ${{ steps.params.outputs.pump }}
      sink: ${{ steps.params.outputs.sink }}
    steps:
      - name: Set test parameters
        uses: TykTechnologies/github-actions/.github/actions/tests/test-controller@production
        id: params
        with:
          variation: ${{ inputs.variation }}
          base_ref: ${{ inputs.base_ref }}
          test_type: ui
  ui-tests:
    needs:
      - test-controller-ui
    runs-on: ${{ vars.WARP_RUNNER_8X_X64 || vars.DEFAULT_RUNNER }}
    # Cost guard: hard cap vs the 360-min default (matters on bigger runners).
    timeout-minutes: 25
    env:
      XUNIT_REPORT_PATH: ${{ github.workspace}}/test-results.xml
      # Use the runner's cores; playwright.config.ts reads PLAYWRIGHT_WORKERS.
      # Sized for the 8x runner set via the DEFAULT_RUNNER GitHub variable.
      PLAYWRIGHT_WORKERS: "6"
    permissions:
      id-token: write # This is required for requesting the Github JWT
      contents: read # This is required for actions/checkout
    strategy:
      fail-fast: false
      matrix:
        envfiles: ${{ fromJson(needs.test-controller-ui.outputs.envfiles) }}
        pump: ${{ fromJson(needs.test-controller-ui.outputs.pump) }}
        sink: ${{ fromJson(needs.test-controller-ui.outputs.sink) }}
        exclude:
          - pump: tykio/tyk-pump-docker-pub:v1.8
            sink: $ECR/tyk-sink:master
          - pump: $ECR/tyk-pump:master
            sink: tykio/tyk-mdcb-docker:v2.4
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: arn:aws:iam::754489498669:role/ecr_rw_tyk
          role-session-name: cipush
          aws-region: eu-central-1
      - id: ecr
        uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78 # v2
        with:
          mask-password: 'true'
      - name: Setup tmate session only in debug mode
        uses: mxschmitt/action-tmate@c0afd6f790e3a5564914980036ebf83216678101 # v3
        if: runner.debug == '1'
        with:
          detached: true
          limit-access-to-actor: true
          # Only ${{ github.actor }} has access
          # See https://github.com/mxschmitt/action-tmate#use-registered-public-ssh-keys
      - name: Fetch environment from tyk-pro
        uses: TykTechnologies/github-actions/.github/actions/tests/checkout-tyk-pro@production
        with:
          org_gh_token: ${{ steps.app-token.outputs.token }}
      - name: Set up test environment
        uses: TykTechnologies/github-actions/.github/actions/tests/env-up@production
        timeout-minutes: 5
        id: env_up
        with:
          base_ref: ${{ inputs.base_ref }}
          tags: ${{ inputs.ee_tags || inputs.std_tags || format('{0}/tyk-ee:master', steps.ecr.outputs.registry) }}
          github_token: ${{ steps.app-token.outputs.token }}
          TYK_DB_LICENSEKEY: ${{ secrets.DASH_LICENSE }}
          TYK_MDCB_LICENSE: ${{ secrets.MDCB_LICENSE }}
      - name: Choose test code branch
        uses: TykTechnologies/github-actions/.github/actions/tests/choose-test-branch@production
        with:
          test_folder: ui
          org_gh_token: ${{ steps.app-token.outputs.token }}
      - name: Fix private module deps
        env:
          TOKEN: '${{ steps.app-token.outputs.token }}'
        run: >
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Execute UI tests
        timeout-minutes: 25
        uses: TykTechnologies/github-actions/.github/actions/tests/ui-tests@production
        id: test_execution
      - name: Upload UI test report to S3
        uses: TykTechnologies/github-actions/.github/actions/tests/ui-tests-report@production
        if: failure() && steps.test_execution.outcome != 'success' && steps.env_up.outcome == 'success'
        with:
          aws_acces_key_id: ${{ secrets.UI_AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.UI_AWS_SECRET_ACCESS_KEY }}
      - name: Generate test reports and collect logs
        uses: TykTechnologies/github-actions/.github/actions/tests/reporting@production
        if: always() && (steps.test_execution.conclusion != 'skipped')
        # Bound this best-effort step: `docker compose logs` inside it can hang on
        # an unresponsive container and otherwise burn the whole job timeout.
        # continue-on-error keeps a log-collection hang from failing an otherwise
        # green test run (the real result comes from the Execute step above).
        timeout-minutes: 8
        continue-on-error: true
        with:
          report_xml: 'true'
          execution_status: ${{ steps.test_execution.outcome }}
  test-controller-api:
    if: |
      !cancelled() &&
      github.event.pull_request.draft == false
    runs-on: ${{ vars.DEFAULT_RUNNER }}
    outputs:
      envfiles: ${{ steps.params.outputs.envfiles }}
      pump: ${{ steps.params.outputs.pump }}
      sink: ${{ steps.params.outputs.sink }}
    steps:
      - name: Set test parameters
        uses: TykTechnologies/github-actions/.github/actions/tests/test-controller@production
        id: params
        with:
          variation: ${{ inputs.variation }}
          base_ref: ${{ inputs.base_ref }}
          test_type: api
  api-tests:
    needs:
      - test-controller-api
    runs-on: ${{ vars.WARP_RUNNER_8X_X64 || vars.DEFAULT_RUNNER }}
    # Cost guard: hard cap vs the 360-min default (matters on bigger runners).
    timeout-minutes: 25
    env:
      XUNIT_REPORT_PATH: ${{ github.workspace}}/test-results.xml
    permissions:
      id-token: write # This is required for requesting the Github JWT
      contents: read # This is required for actions/checkout
    strategy:
      fail-fast: false
      matrix:
        envfiles: ${{ fromJson(needs.test-controller-api.outputs.envfiles) }}
        pump: ${{ fromJson(needs.test-controller-api.outputs.pump) }}
        sink: ${{ fromJson(needs.test-controller-api.outputs.sink) }}
        exclude:
          - pump: tykio/tyk-pump-docker-pub:v1.8
            sink: $ECR/tyk-sink:master
          - pump: $ECR/tyk-pump:master
            sink: tykio/tyk-mdcb-docker:v2.4
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: arn:aws:iam::754489498669:role/ecr_rw_tyk
          role-session-name: cipush
          aws-region: eu-central-1
      - id: ecr
        uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78 # v2
        with:
          mask-password: 'true'
      - name: Setup tmate session only in debug mode
        uses: mxschmitt/action-tmate@c0afd6f790e3a5564914980036ebf83216678101 # v3
        if: runner.debug == '1'
        with:
          detached: true
          limit-access-to-actor: true
          # Only ${{ github.actor }} has access
          # See https://github.com/mxschmitt/action-tmate#use-registered-public-ssh-keys
      - name: Fetch environment from tyk-pro
        uses: TykTechnologies/github-actions/.github/actions/tests/checkout-tyk-pro@production
        with:
          org_gh_token: ${{ steps.app-token.outputs.token }}
      - name: Set up test environment
        uses: TykTechnologies/github-actions/.github/actions/tests/env-up@production
        timeout-minutes: 5
        id: env_up
        with:
          base_ref: ${{ inputs.base_ref }}
          tags: ${{ inputs.ee_tags || inputs.std_tags || format('{0}/tyk-ee:master', steps.ecr.outputs.registry) }}
          github_token: ${{ steps.app-token.outputs.token }}
          TYK_DB_LICENSEKEY: ${{ secrets.DASH_LICENSE }}
          TYK_MDCB_LICENSE: ${{ secrets.MDCB_LICENSE }}
      - name: Choose test code branch
        uses: TykTechnologies/github-actions/.github/actions/tests/choose-test-branch@production
        with:
          test_folder: api
          org_gh_token: ${{ steps.app-token.outputs.token }}
      - name: Run API tests
        uses: TykTechnologies/github-actions/.github/actions/tests/api-tests@production
        timeout-minutes: 25
        id: test_execution
        with:
          user_api_secret: ${{ steps.env_up.outputs.USER_API_SECRET }}
      - name: Generate test reports and collect logs
        uses: TykTechnologies/github-actions/.github/actions/tests/reporting@production
        if: always() && (steps.test_execution.conclusion != 'skipped')
        # Bound this best-effort step: `docker compose logs` inside it can hang on
        # an unresponsive container and otherwise burn the whole job timeout.
        # continue-on-error keeps a log-collection hang from failing an otherwise
        # green test run (the real result comes from the Execute step above).
        timeout-minutes: 8
        continue-on-error: true
        with:
          report_xml: 'true'
          execution_status: ${{ steps.test_execution.outcome }}
  test-controller-distros:
    if: |
      !cancelled() &&
      github.event.pull_request.draft == false
    runs-on: ${{ vars.DEFAULT_RUNNER }}
    outputs:
      deb: ${{ steps.params.outputs.deb }}
      rpm: ${{ steps.params.outputs.rpm }}
      rpm_amd64: ${{ steps.params.outputs.rpm_amd64 }}
    steps:
      - name: Set distro matrix
        uses: TykTechnologies/github-actions/.github/actions/tests/distro-matrix@production
        id: params
  upgrade-tests:
    if: github.event_name != 'pull_request'
    needs:
      - test-controller-distros
    uses: TykTechnologies/github-actions/.github/workflows/upgrade-tests.yml@production
    with:
      deb: ${{ needs.test-controller-distros.outputs.deb }}
      rpm: ${{ needs.test-controller-distros.outputs.rpm }}
      rpm_amd64: ${{ needs.test-controller-distros.outputs.rpm_amd64 }}
      package_name: tyk-dashboard
      upgrade_repo: tyk-dashboard
      runs_on: ${{ vars.DEFAULT_RUNNER }}
      run_gateway_tests: false
