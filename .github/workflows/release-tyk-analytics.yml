# yamllint disable rule:line-length rule:truthy
---
name: release / tyk-analytics

# PHASE 1a SKELETON.
# Proves the reusable-workflow mechanics only. It deliberately does NOT run
# goreleaser or build the real image - a real ci/Dockerfile.std build needs
# artifacts goreleaser produces, and failing there would tell us nothing about
# the boundary. Instead it verifies the caller's ci/ files are present and
# exercises every integration point that could break.

on:
  workflow_call:
    inputs:
      golang_cross:
        description: 'golang-cross image tag to build with, e.g. 1.26-bullseye (per branch: 1.24-bullseye on release-5.3)'
        type: string
        required: true
    outputs:
      std_tags:
        description: 'Image tags that the real build would produce'
        value: ${{ jobs.build.outputs.std_tags }}
      fips_tags:
        description: 'FIPS image tags'
        value: ${{ jobs.build.outputs.fips_tags }}
      commit_author:
        description: 'Author of the head commit'
        value: ${{ jobs.build.outputs.commit_author }}

jobs:
  build:
    name: ${{ inputs.golang_cross }}
    # Proves: vars resolve against the CALLER repo, not github-actions.
    runs-on: ${{ vars.WARP_RUNNER_8X_X64 || vars.BUILD_RUNNER || vars.DEFAULT_RUNNER }}
    timeout-minutes: 15
    permissions:
      id-token: write   # AWS OIDC
      contents: read    # actions/checkout
    outputs:
      std_tags: ${{ steps.tags.outputs.std_tags }}
      fips_tags: ${{ steps.tags.outputs.fips_tags }}
      commit_author: ${{ steps.tags.outputs.commit_author }}

    steps:
      # Proves: secrets: inherit reaches org/repo secrets from the caller.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies

      # Proves: checkout lands on the CALLER repo at the PR head sha, submodules included.
      - name: Checkout tyk-analytics
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ steps.app-token.outputs.token }}
          submodules: true

      - name: Diagnostics - whose context are we in?
        env:
          BASE_REF: ${{ startsWith(github.event_name, 'pull_request') && github.base_ref || github.ref_name }}
        run: |
          {
            echo "### Context"
            echo '```'
            echo "golang_cross (input)= ${{ inputs.golang_cross }}"
            echo "github.repository   = ${{ github.repository }}"
            echo "github.ref          = ${{ github.ref }}"
            echo "github.sha          = ${{ github.sha }}"
            echo "github.event_name   = ${{ github.event_name }}"
            echo "BASE_REF (computed) = ${BASE_REF}"
            echo "runner              = ${{ runner.name }} / ${{ runner.os }}"
            echo "DEFAULT_RUNNER      = ${{ vars.DEFAULT_RUNNER }}"
            echo "WARP_RUNNER_8X_X64  = ${{ vars.WARP_RUNNER_8X_X64 }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Proves: the caller's ci/ files are present in the checkout.
      - name: Verify caller ci/ files are reachable
        run: |
          set -euo pipefail
          for f in ci/Dockerfile.std ci/goreleaser/goreleaser.yml .assets_vendor; do
            if [[ -e "$f" ]]; then
              echo "found    $f"
            else
              echo "::error::missing $f - caller checkout is wrong"
              exit 1
            fi
          done

      # Proves: OIDC works from inside a called workflow. THE critical step.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c  # v4
        with:
          role-to-assume: arn:aws:iam::754489498669:role/ecr_rw_tyk
          role-session-name: releng-poc
          aws-region: eu-central-1

      - name: ECR login
        id: ecr
        uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78  # v2
        with:
          mask-password: 'true'

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      # Generated here so the POC adds no file to tyk-analytics.
      - name: Write throwaway Dockerfile
        run: printf 'FROM alpine:3.20\nRUN echo releng-poc\n' > Dockerfile.poc

      # Trivial image on purpose - proves buildx + registry auth without needing
      # goreleaser artifacts. push: false, nothing reaches the registry.
      - name: Build a throwaway image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: ./Dockerfile.poc
          push: false
          tags: ${{ steps.ecr.outputs.registry }}/tyk-analytics:poc-${{ github.sha }}

      - name: Set outputs
        id: tags
        run: |
          REG='${{ steps.ecr.outputs.registry }}'
          echo "std_tags=${REG}/tyk-analytics:sha-${{ github.sha }}"       >> "$GITHUB_OUTPUT"
          echo "fips_tags=${REG}/tyk-analytics-fips:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "commit_author=$(git log -1 --pretty=format:'%an')"         >> "$GITHUB_OUTPUT"
