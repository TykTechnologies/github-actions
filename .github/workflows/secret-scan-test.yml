---
name: Secret scan tests

# Builds images that leak fake credentials in common ways, plus correctly
# built controls, and checks the secret-scan action catches every leak,
# passes the controls and fails closed when a scanner cannot run.

on:
  pull_request:
    paths:
      - ".github/actions/secret-scan/**"
      - "tests/secret-scan/**"
      - ".github/workflows/secret-scan-test.yml"
  push:
    branches:
      - main
    paths:
      - ".github/actions/secret-scan/**"
      - "tests/secret-scan/**"
      - ".github/workflows/secret-scan-test.yml"

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Build scenario images
        run: bash tests/secret-scan/make-scenarios.sh "$RUNNER_TEMP/ss"

      - name: Action passes a correctly built image
        uses: ./.github/actions/secret-scan
        with:
          path: ${{ runner.temp }}/ss/ctx/c01
          image: docker://secret-scan-test/c01

      - name: Action fails on a leaking image
        id: leak
        continue-on-error: true
        uses: ./.github/actions/secret-scan
        with:
          path: ${{ runner.temp }}/ss/ctx/s01
          image: docker://secret-scan-test/s01

      - name: Check the leaking image failed the action
        env:
          OUTCOME: ${{ steps.leak.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::secret-scan passed an image with a leaked token"
            exit 1
          fi

      - name: Run all scenarios
        run: PATH="$RUNNER_TEMP/secret-scan-bin:$PATH" bash tests/secret-scan/run.sh "$RUNNER_TEMP/ss"
