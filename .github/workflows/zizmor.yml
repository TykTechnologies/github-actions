---
name: zizmor

# Reusable workflow that audits the calling repository's GitHub Actions
# with zizmor (https://docs.zizmor.sh). Pull requests get a sticky summary
# comment on every repo; SARIF upload to code scanning is an opt-in extra
# that only takes effect on public repos, where it needs no Advanced
# Security license. Private repos fall back to inline annotations.

on:
  workflow_call:
    inputs:
      zizmor_version:
        required: false
        type: string
        default: "1.29.0"
        description: "zizmor version to run"
      persona:
        required: false
        type: string
        default: regular
        description: "zizmor persona: regular, pedantic or auditor"
      upload_sarif:
        required: false
        type: boolean
        default: false
        description: "Upload SARIF to GitHub code scanning; only takes effect on public repos."
      enforce:
        required: false
        type: boolean
        default: false
        description: "Fail the job when findings at or above min_severity are present"
      min_severity:
        required: false
        type: string
        default: medium
        description: "Severity threshold used when enforce is true (low, medium or high)"

permissions: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload-sarif
      contents: read # actions/checkout on private repos
      actions: read # upload-sarif on private repos
      pull-requests: write # sticky PR comment
    env:
      ZIZMOR_VERSION: ${{ inputs.zizmor_version }}
      ZIZMOR_PERSONA: ${{ inputs.persona }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uvx "zizmor@${ZIZMOR_VERSION}" --persona "${ZIZMOR_PERSONA}" --format sarif . > results.sarif
          uvx "zizmor@${ZIZMOR_VERSION}" --persona "${ZIZMOR_PERSONA}" --format json --no-exit-codes . > results.json

      # Needs an Advanced Security license on private repos, so skipped there.
      - name: Upload SARIF
        if: ${{ inputs.upload_sarif && !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
          category: zizmor

      - name: Annotate findings
        if: ${{ !inputs.upload_sarif || github.event.repository.private }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Annotations are capped at 10 per step; the log has everything.
          uvx "zizmor@${ZIZMOR_VERSION}" --persona "${ZIZMOR_PERSONA}" --format github --no-exit-codes .

      - name: Summarise findings
        id: summary
        run: |
          count() {
            jq --arg sev "$1" 'map(select(.determinations.severity == $sev)) | length' results.json
          }
          HIGH=$(count High)
          MEDIUM=$(count Medium)
          LOW=$(count Low)
          INFO=$(count Informational)
          TOTAL=$(jq length results.json)

          {
            echo "## zizmor findings"
            echo ""
            echo "| Severity | Count |"
            echo "|----------|-------|"
            echo "| High     | $HIGH |"
            echo "| Medium   | $MEDIUM |"
            echo "| Low      | $LOW |"
            echo "| Info     | $INFO |"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "high=$HIGH"
            echo "medium=$MEDIUM"
            echo "low=$LOW"
            echo "info=$INFO"
            echo "total=$TOTAL"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on pull request
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HIGH: ${{ steps.summary.outputs.high }}
          MEDIUM: ${{ steps.summary.outputs.medium }}
          LOW: ${{ steps.summary.outputs.low }}
          INFO: ${{ steps.summary.outputs.info }}
          TOTAL: ${{ steps.summary.outputs.total }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MARKER="<!-- zizmor-report -->"
          if [ "$TOTAL" = "0" ]; then
            BODY="$MARKER
          ## zizmor

          :white_check_mark: No findings in this repository's workflows. ([run]($RUN_URL))"
          else
            BODY="$MARKER
          ## zizmor findings

          | Severity | Count |
          |----------|-------|
          | High     | $HIGH |
          | Medium   | $MEDIUM |
          | Low      | $LOW |
          | Info     | $INFO |

          Full details are in the [workflow run]($RUN_URL)."
          fi

          COMMENT_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- zizmor-report -->"))][0].id // empty' \
            | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -f body="$BODY" > /dev/null
            echo "updated comment $COMMENT_ID"
          elif [ "$TOTAL" != "0" ]; then
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$BODY" > /dev/null
            echo "posted new comment"
          else
            echo "no findings and no existing comment, nothing to post"
          fi

      - name: Enforce threshold
        if: ${{ inputs.enforce }}
        env:
          MIN_SEVERITY: ${{ inputs.min_severity }}
          HIGH: ${{ steps.summary.outputs.high }}
          MEDIUM: ${{ steps.summary.outputs.medium }}
          LOW: ${{ steps.summary.outputs.low }}
        run: |
          case "$MIN_SEVERITY" in
            high) GATED=$HIGH ;;
            medium) GATED=$((HIGH + MEDIUM)) ;;
            low) GATED=$((HIGH + MEDIUM + LOW)) ;;
            *) echo "unknown min_severity: $MIN_SEVERITY" >&2; exit 2 ;;
          esac
          if [ "$GATED" -gt 0 ]; then
            echo "::error::zizmor found $GATED finding(s) at or above $MIN_SEVERITY severity"
            exit 1
          fi
