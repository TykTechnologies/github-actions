name: 'Jira PR Validator'
description: 'Ensures pull requests align with the Jira tickets'

inputs:
  jira-base-url:
    description: 'The Jira API base URL (e.g., https://api.atlassian.com/ex/jira/<cloudId>).'
    required: true
  jira-read-auth:
    description: 'Base64-encoded Jira email and scoped API token for read-only access.'
    required: true

runs:
  using: 'composite'
  steps:
    # The linter image lives in a private ECR registry, so the action assumes
    # the push role and logs in before running the container.
    - name: Configure AWS credentials for use
      uses: aws-actions/configure-aws-credentials@67fbcbb121271f7775d2e7715933280b06314838  # v1
      with:
        role-to-assume: arn:aws:iam::754489498669:role/ecr_rw_tyk
        role-session-name: cipush
        aws-region: eu-central-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@5a88a04c91d5c6f97aae0d9be790e64d9b1d47b7  # v1

    - name: Run Jira Linter
      id: linter_step
      shell: bash
      continue-on-error: true
      run: |
        BRANCH_NAME="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
        echo "--> running the linter against $BRANCH_NAME branch"
        # Each -e passes the variable by name, so no secret reaches the
        # command line or the workflow log.
        docker run --rm \
          -e JL_JIRA_BASEURL \
          -e JL_JIRA_READAUTH \
          -e GITHUB_TOKEN \
          -e GITHUB_REPOSITORY \
          -e JL_PR_NUMBER \
          -e JL_PR_TITLE \
          754489498669.dkr.ecr.eu-central-1.amazonaws.com/jira-linter:latest \
          --branch="$BRANCH_NAME" 2> ${{ github.action_path }}/stderr.txt
      env:
        JL_JIRA_BASEURL: ${{ inputs.jira-base-url }}
        JL_JIRA_READAUTH: ${{ inputs.jira-read-auth }}
        # the following environment variables will be populated for each PR by GitHub itself.
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        JL_PR_NUMBER: ${{ github.event.pull_request.number }}
        JL_PR_TITLE: ${{ github.event.pull_request.title }}
    - name: Prepare Failure Comment Body
      if: steps.linter_step.outcome == 'failure'
      shell: bash
      run: |
        BRANCH_NAME="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
        COMMIT_HASH="${{ github.event.pull_request.head.sha || github.sha }}"
        COMMIT_SHORT="${COMMIT_HASH:0:7}"
        TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

        cat > ${{ github.action_path }}/linter-output.txt << EOF
        ## 🚨 Jira Linter Failed

        **Commit:** [\`${COMMIT_SHORT}\`](${{ github.server_url }}/${{ github.repository }}/commit/${COMMIT_HASH})
        **Failed at:** ${TIMESTAMP}

        The Jira linter failed to validate your PR. Please check the error details below:

        <details>
        <summary>🔍 Click to view error details</summary>

        \`\`\`
        $(cat ${{ github.action_path }}/stderr.txt)
        \`\`\`

        </details>

        ### Next Steps
        - Ensure your branch name contains a valid Jira ticket ID (e.g., \`ABC-123\`)
        - Verify your PR title matches the branch's Jira ticket ID
        - Check that the Jira ticket exists and is accessible

        ---
        _This comment will be automatically deleted once the linter passes._

        <!-- jira-linter-comment-marker -->
        EOF

    - name: Post Sticky Comment on Failure
      if: steps.linter_step.outcome == 'failure'
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        header: jira-linter
        path: ${{ github.action_path }}/linter-output.txt
        recreate: true

    - name: Delete Sticky Comment on Success
      if: steps.linter_step.outcome == 'success'
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        header: jira-linter
        delete: true

    - name: Fail Action if Linter Failed
      if: steps.linter_step.outcome == 'failure'
      shell: bash
      run: |
        echo "❌ Jira Linter failed - failing the action"
        exit 1
