name: 'Jira PR Validator'
description: 'Ensures pull requests align with the Jira tickets'

inputs:
  jira-base-url:
    description: 'The Jira API base URL (e.g., https://api.atlassian.com/ex/jira/<cloudId>).'
    required: true
  jira-read-auth:
    description: 'Base64-encoded Jira email and scoped API token for read-only access.'
    required: true

runs:
  using: 'docker'
  image: 'Dockerfile'
  # Resolve the branch name here so the container gets it directly:
  # github.head_ref is set on pull_request events, github.ref_name otherwise.
  args:
    - ${{ github.head_ref || github.ref_name }}
  env:
    JL_JIRA_BASEURL: ${{ inputs.jira-base-url }}
    JL_JIRA_READAUTH: ${{ inputs.jira-read-auth }}
    # the following environment variables will be populated for each PR by GitHub itself.
    GITHUB_TOKEN: ${{ github.token }}
    GITHUB_REPOSITORY: ${{ github.repository }}
    JL_PR_NUMBER: ${{ github.event.pull_request.number }}
    JL_PR_TITLE: ${{ github.event.pull_request.title }}
    # Head commit of the PR, linked from the failure comment. GITHUB_SHA points
    # at the merge commit on pull_request events, so it is passed explicitly.
    HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
